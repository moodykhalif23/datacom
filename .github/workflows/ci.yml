name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: test on one core
        run: GOMAXPROCS=1 go test ./...
      - name: browser build
        run: GOOS=js GOARCH=wasm go vet . && python3 tools/web.py 0.0.0-dev
      - name: fuzz smoke
        run: |
          for f in FuzzReadCSV FuzzCSVSplit FuzzReadJSON FuzzValues FuzzRedactText FuzzCleanText; do
            go test ./pipeline/ -run '^$' -fuzz="^$f\$" -fuzztime=15s
          done
      - name: known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: build
        run: go build -ldflags="-s -w" -o datacom . && ./datacom version
      - name: python wheel
        run: |
          python3 tools/wheels.py 0.0.0-dev linux/amd64
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --no-index dist/wheels/*.whl
          cd /tmp && DATACOM_SAMPLE=$GITHUB_WORKSPACE/testdata/messy.csv /tmp/venv/bin/python -I $GITHUB_WORKSPACE/python/tests/test_datacom.py
