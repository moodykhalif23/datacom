name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: fuzz smoke
        run: |
          for f in FuzzReadCSV FuzzReadJSON FuzzValues; do
            go test ./pipeline/ -run '^$' -fuzz="^$f\$" -fuzztime=15s
          done
      - name: build
        run: go build -ldflags="-s -w" -o datacom . && ./datacom version
